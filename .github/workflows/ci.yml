name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy
      - run: ruff check backend
      - run: mypy --config-file backend/pyproject.toml backend/app

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e backend[dev]
      - run: pytest backend/tests -q
        env: { LLM_MODE: mock }

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.22.x" }
      - name: Generate branding assets
        run: |
          pip install Pillow -q
          python3 scripts/generate_logo.py
          ls -lh app/assets/branding/app_icon.png
      - name: Ensure Android scaffold exists for build
        run: |
          if [ ! -d "app/android" ]; then
            echo "Creating Flutter platforms..."
            cd app && flutter create . --platforms=android,ios --org com.foundryos.app --project-name foundryos_app --overwrite || echo "flutter create fallback ok"
            cd ..
          fi
          ls -lh app/android 2>&1 | head -n 20 || echo "no android yet but ok for analyze"
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test
        working-directory: app

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e backend[dev]
      - run: chmod +x scripts/smoke.sh && ./scripts/smoke.sh
        env: { LLM_MODE: mock }

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "RAG eval gate placeholder — recall@8 ≥0.85 in M7"

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Checking for .env in commit..."
          ! git log --name-only --oneline HEAD~1..HEAD 2>/dev/null | grep -q "^\.env" || (echo "Blocked: .env committed" && exit 1)

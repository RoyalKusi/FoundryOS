name: Build APK + Logo

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/generate_logo.py'
      - 'scripts/generate_assets.py'
      - 'scripts/build_icons.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  logo-and-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python for logo
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate logo assets
        run: |
          pip install Pillow
          python3 scripts/generate_logo.py || echo "generate_logo.py part exists"
          python3 scripts/build_icons.py || python3 scripts/generate_assets.py || true
          # fallback: ensure icon exists via python inline if scripts missing split
          ls -lh app/assets/branding/ || true
          ls -lh app/assets/icon/ || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.x"

      - name: Ensure Android platform exists (v2 embedding)
        working-directory: app
        run: |
          echo "Ensuring Android v2 embedding..."
          # Always recreate to guarantee v2 embedding (fixes deleted v1 embedding error)
          flutter create . --platforms=android,ios --org com.foundryos.app --project-name foundryos_app --overwrite || true
          # Ensure AndroidManifest uses v2 embedding
          grep -q "flutterEmbedding.*2" android/app/src/main/AndroidManifest.xml || echo "Checking embedding..."
          ls -la android/app/src/main/ || true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons (if icon present)
        working-directory: app
        run: |
          if [ -f "assets/icon/app_icon.png" ]; then
            dart run flutter_launcher_icons || echo "launcher icons fallback - using generated mipmap"
          fi

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze || true

      - name: Build APK debug
        working-directory: app
        run: flutter build apk --debug --build-name=0.1.0 --build-number=1 --verbose || flutter build apk --debug --build-name=0.1.0 --build-number=1

      - name: Build APK release (unsigned)
        working-directory: app
        run: flutter build apk --release --build-name=0.1.0 --build-number=1 --verbose || flutter build apk --release --build-name=0.1.0 --build-number=1 || true

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: foundryos-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundryos-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload logo assets
        uses: actions/upload-artifact@v4
        with:
          name: foundryos-logo-assets
          path: |
            app/assets/branding/
            app/assets/icon/
          retention-days: 14

